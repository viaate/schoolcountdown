<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider Hub | Lunch</title>
  <style>
    :root {
      --blue:      #00285E;
      --blue-mid:  #003d8f;
      --blue-light:#0055c4;
      --white:     #ffffff;
      --card-bg:   rgba(255,255,255,0.07);
      --shadow:    0 8px 32px rgba(0,0,0,0.35);
      --accent:    rgba(255,255,255,0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      min-height: 100vh;
      background-color: var(--blue);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      transition: background-color 0.9s ease;
    }

    /* ── Header ────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2rem;
      margin-top: 1rem;
    }

    .school-name {
      font-size: clamp(1rem, 3vw, 1.25rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--accent);
    }

    .page-title {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--white);
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      margin: 1rem auto;
    }

    .date-label {
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
    }

    /* ── Nav buttons ───────────────────────────────────── */
    .nav-btns {
      position: fixed;
      top: 1.1rem;
      right: 1.1rem;
      display: flex;
      gap: 0.5rem;
      z-index: 200;
    }
    .nav-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      border-radius: 10px;
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.2s;
      letter-spacing: 0.03em;
      font-family: inherit;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Main content area ──────────────────────────────── */
    .content {
      width: 100%;
      max-width: 640px;
    }

    /* ── Menu card ──────────────────────────────────────── */
    .menu-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      position: relative;
      overflow: hidden;
    }

    /* ── Off-day states ─────────────────────────────────── */
    .off-day {
      text-align: center;
      padding: 3rem 1rem;
    }

    .off-day .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }

    .off-day .title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .off-day .sub {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.55);
    }

    /* ── Menu section labels ────────────────────────────── */
    .section {
      margin-bottom: 1.5rem;
    }

    .section:last-child { margin-bottom: 0; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
    }

    .section-divider {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .menu-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding-left: 0.25rem;
    }

    .menu-items li {
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      padding: 0.3rem 0;
      padding-left: 1rem;
      border-left: 2px solid rgba(255,255,255,0.15);
      line-height: 1.35;
    }

    /* ── Week nav strip ─────────────────────────────────── */
    .week-nav {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .day-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      border-radius: 8px;
      padding: 0.3rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      letter-spacing: 0.03em;
    }

    .day-pill:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .day-pill.active {
      background: rgba(255,184,28,0.2);
      border-color: rgba(255,184,28,0.5);
      color: #fff;
    }

    .day-pill.no-data {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    /* ── No data note ───────────────────────────────────── */
    .no-data-note {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      text-align: center;
      margin-top: 1.5rem;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* ── Search ─────────────────────────────────────────── */
    .search-section {
      width: 100%;
      max-width: 640px;
      margin-bottom: 1.25rem;
    }

    .search-title {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-wrap {
      display: flex;
      gap: 0.5rem;
    }

    .search-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.3); }
    .search-input:focus {
      border-color: rgba(255,184,28,0.5);
      background: rgba(255,255,255,0.12);
    }

    .search-clear {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      line-height: 1;
    }
    .search-clear:hover { background: rgba(255,255,255,0.16); color: #fff; }

    .search-results {
      margin-top: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .search-empty {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
      padding: 1.25rem 0;
    }

    .result-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .result-card:hover { background: rgba(255,255,255,0.18); }
    .result-card.is-past { opacity: 0.45; }
    .result-card.is-today { border-color: rgba(255,184,28,0.5); }

    .result-date-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .result-date {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
    }
    .result-badge {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background: rgba(255,184,28,0.25);
      border: 1px solid rgba(255,184,28,0.45);
      color: #fff;
    }
    .result-badge.next { background: rgba(100,255,130,0.18); border-color: rgba(100,255,130,0.4); }

    .result-matches { display: flex; flex-direction: column; gap: 0.2rem; }
    .result-match {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .result-match mark {
      background: rgba(255,184,28,0.35);
      color: #fff;
      border-radius: 3px;
      padding: 0 2px;
    }
    .result-section-tag {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ── Menu item readability ───────────────────────────── */
    .menu-items li {
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }
    .section-label {
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .result-match {
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }
    .result-date {
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* ── Settings modal ─────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(0,18,50,0.96);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 2rem;
      width: min(360px, 90vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      color: #fff;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }
    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; letter-spacing: 0.04em; }
    .modal .modal-sub { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 1.25rem; }
    .check-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .check-row:last-of-type { border-bottom: none; }
    .check-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #fff; cursor: pointer; flex-shrink: 0; }
    .check-row label { font-size: 0.88rem; color: rgba(255,255,255,0.75); cursor: pointer; flex: 1; }
    .modal-close {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.7rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .modal-close:hover { background: rgba(255,255,255,0.17); }

    @media (max-width: 480px) {
      .menu-card { padding: 1.5rem 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <div class="nav-btns">
    <a href="index.html" class="nav-btn">&#8592; Countdown</a>
    <a href="schedule.html" class="nav-btn">&#128218; Schedule</a>
    <a href="calculator.html" class="nav-btn">&#128202; Grades</a>
    <button class="nav-btn" onclick="openSettings()">&#9881; Settings</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <h2>&#9881; Settings</h2>
      <p class="modal-sub">Check the days you have late lunch. Saved automatically.</p>
      <div class="check-row"><input type="checkbox" id="ll-mon" onchange="saveSetting('mon',this.checked)"><label for="ll-mon">Monday — Late Lunch</label></div>
      <div class="check-row"><input type="checkbox" id="ll-tue" onchange="saveSetting('tue',this.checked)"><label for="ll-tue">Tuesday — Late Lunch</label></div>
      <div class="check-row"><input type="checkbox" id="ll-wed" onchange="saveSetting('wed',this.checked)"><label for="ll-wed">Wednesday — Late Lunch</label></div>
      <div class="check-row"><input type="checkbox" id="ll-thu" onchange="saveSetting('thu',this.checked)"><label for="ll-thu">Thursday — Late Lunch</label></div>
      <div class="check-row"><input type="checkbox" id="ll-fri" onchange="saveSetting('fri',this.checked)"><label for="ll-fri">Friday — Late Lunch</label></div>
      <button class="modal-close" onclick="closeSettings()">Done</button>
    </div>
  </div>

  <header>
    <p class="school-name">Raider Hub</p>
    <h1 class="page-title">What's for Lunch?</h1>
    <div class="divider"></div>
    <p class="date-label" id="date-label">Loading…</p>
  </header>

  <div class="content">
    <!-- Search -->
    <div class="search-section">
      <div class="search-title">Find a Menu Item</div>
      <div class="search-wrap">
        <input class="search-input" id="search-input" type="text"
               placeholder="e.g. pizza, monday, may, chicken…"
               oninput="doSearch(this.value)" autocomplete="off" spellcheck="false" />
        <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Clear">&#x2715;</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <div class="week-nav" id="week-nav"></div>
    <div class="menu-card" id="menu-card"></div>
    <p class="no-data-note" id="no-data-note"></p>
  </div>

        main:  ['Pepperoni Pizza', 'Cheese Pizza', 'Garden Vegetable Pizza', 'Steamed Broccoli'],
      },

    // No-school days (weekdays with no lunch)
    const NO_SCHOOL = new Set([
      '2026-4-17', // Parent/Teacher Conferences
      '2026-5-25', // Memorial Day
    ]);

    const DAY_NAMES  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MON_NAMES  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function dateKey(d) {
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    function isWeekend(d) { const wd = d.getDay(); return wd === 0 || wd === 6; }

    function isNoSchool(d) {
      return NO_SCHOOL.has(dateKey(d));
    }

    function friendlyDate(d) {
      return `${DAY_NAMES[d.getDay()]}, ${MON_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }

    // ── Get the school-week days around a given date ──────────────────
    function getWeekDays(d) {
      // Monday of current week
      const day = d.getDay();
      const monday = new Date(d);
      monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      const days = [];
      for (let i = 0; i < 5; i++) {
        const dd = new Date(monday);
        dd.setDate(monday.getDate() + i);
        days.push(dd);
      }
      return days;
    }

    // ── Render the menu for a given date ─────────────────────────────
    let viewDate = new Date();

    function render(d) {
      viewDate = d;
      const key  = dateKey(d);
      const menu = MENU[key];

      // Update header date
      document.getElementById('date-label').textContent = friendlyDate(d);
      document.getElementById('no-data-note').textContent = '';

      // Build week nav
      buildWeekNav(d);

      const card = document.getElementById('menu-card');

      if (isWeekend(d)) {
        card.innerHTML = `
          <div class="off-day">
            <span class="icon">&#127774;</span>
            <div class="title">It's the Weekend!</div>
            <div class="sub">No school &mdash; enjoy your break.</div>
          </div>`;
        return;
      }

      if (isNoSchool(d)) {
        card.innerHTML = `
          <div class="off-day">
            <span class="icon">&#127981;</span>
            <div class="title">No School Today</div>
            <div class="sub">${friendlyDate(d)}</div>
          </div>`;
        return;
      }

      if (!menu) {
        card.innerHTML = `
          <div class="off-day">
            <span class="icon">&#127860;</span>
            <div class="title">Menu Not Available</div>
            <div class="sub">No lunch data for this day yet.</div>
          </div>`;
        document.getElementById('no-data-note').textContent =
          'Menus are added monthly. Check back when the next menu is posted.';
        return;
      }

      function section(icon, label, items) {
        const lis = items.map(i => `<li>${escHtml(i)}</li>`).join('');
        return `
          <div class="section">
            <div class="section-header">
              <span class="section-icon">${icon}</span>
              <span class="section-label">${label}</span>
              <div class="section-divider"></div>
            </div>
            <ul class="menu-items">${lis}</ul>
          </div>`;
      }

      card.innerHTML =
        section('&#127869;', 'Main Entree & Sides', menu.main) +
        section('&#127857;', "Bowl'd", menu.bowl) +
        section('&#127859;', 'Soup', menu.soup);
    }

    function buildWeekNav(active) {
      const weekDays = getWeekDays(active);
      const activeKey = dateKey(active);
      const nav = document.getElementById('week-nav');
      nav.innerHTML = weekDays.map(d => {
        const k   = dateKey(d);
        const has = !!MENU[k];
        const off = isNoSchool(d);
        const cls = [
          'day-pill',
          k === activeKey ? 'active' : '',
          (!has && !off && !isWeekend(d)) ? 'no-data' : '',
        ].filter(Boolean).join(' ');
        const label = DAY_NAMES[d.getDay()].slice(0, 3) + ' ' + d.getDate();
        return `<button class="${cls}" onclick="render(new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()}))">${label}</button>`;
      }).join('');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Background: match current class color ─────────────────────────
    const BG_GRADIENTS = {
      red:       '#C62828',
      orange:    '#E64A19',
      yellow:    '#F9A825',
      green:     '#2E7D32',
      lightblue: '#0277BD',
      royalblue: '#283593',
      purple:    '#7B1FA2',
      none:      '#00285E',
    };

    function getLateLunch() {
      try { return JSON.parse(localStorage.getItem('phLateLunch')) || {}; } catch { return {}; }
    }
    function saveSetting(day, val) {
      const s = getLateLunch(); s[day] = val;
      localStorage.setItem('phLateLunch', JSON.stringify(s));
    }
    function loadSettingsUI() {
      const s = getLateLunch();
      ['mon','tue','wed','thu','fri'].forEach(d => {
        const el = document.getElementById('ll-' + d);
        if (el) el.checked = !!s[d];
      });
    }
    function openSettings()  { loadSettingsUI(); document.getElementById('modal-overlay').classList.add('open'); }
    function closeSettings() { document.getElementById('modal-overlay').classList.remove('open'); }

    function hmI(h, m) { return h * 60 + m; }

    function buildBgSchedule(dayOfWeek, lateLunch) {
      const s = (sh,sm,eh,em,c) => ({ s:hmI(sh,sm), e:hmI(eh,em), color:c });
      switch (dayOfWeek) {
        case 1: {
          const base = [s(8,45,9,30,'red'),s(9,35,10,20,'orange'),s(10,35,11,20,'yellow'),s(11,25,12,10,'green')];
          const mid  = lateLunch ? [s(12,10,12,55,'lightblue'),s(12,55,13,40,'none')] : [s(12,10,12,55,'none'),s(12,55,13,40,'lightblue')];
          return [...base,...mid,s(13,45,14,30,'royalblue'),s(14,35,15,20,'purple')];
        }
        case 2: {
          const base = [s(8,45,10,0,'yellow'),s(10,0,10,15,'none'),s(10,15,10,45,'none'),s(10,45,12,0,'orange')];
          const mid  = lateLunch ? [s(12,0,12,45,'red'),s(12,45,13,30,'none'),s(13,30,14,0,'red')] : [s(12,0,12,45,'none'),s(12,45,14,0,'red')];
          return [...base,...mid,s(14,5,14,30,'none'),s(14,30,15,20,'none')];
        }
        case 3: {
          const base = [s(8,45,10,0,'lightblue'),s(10,0,10,45,'none'),s(10,45,12,0,'green')];
          const mid  = lateLunch ? [s(12,0,12,45,'purple'),s(12,45,13,30,'none'),s(13,30,14,0,'purple')] : [s(12,0,12,45,'none'),s(12,45,14,0,'purple')];
          return [...base,...mid,s(14,5,15,20,'royalblue')];
        }
        case 4: {
          const base = [s(10,0,11,15,'red'),s(11,15,11,30,'none'),s(11,30,12,0,'none')];
          const mid  = lateLunch ? [s(12,0,12,45,'orange'),s(12,45,13,30,'none'),s(13,30,14,0,'orange')] : [s(12,0,12,45,'none'),s(12,45,14,0,'orange')];
          return [...base,...mid,s(14,5,15,20,'yellow')];
        }
        case 5: {
          const base = [s(8,45,10,0,'royalblue'),s(10,0,10,25,'none'),s(10,25,10,45,'none'),s(10,45,12,0,'purple')];
          const mid  = lateLunch ? [s(12,0,12,45,'green'),s(12,45,13,30,'none'),s(13,30,14,0,'green')] : [s(12,0,12,45,'none'),s(12,45,14,0,'green')];
          return [...base,...mid,s(14,5,15,20,'lightblue')];
        }
        default: return [];
      }
    }

    let lastBgKey = '';
    function updateBackground() {
      const now = new Date();
      const day = now.getDay();
      let colorKey = 'none';
      if (day >= 1 && day <= 5) {
        const ll = getLateLunch();
        const dk = ['','mon','tue','wed','thu','fri'][day];
        const sched = buildBgSchedule(day, !!ll[dk]);
        const nowMin = now.getHours() * 60 + now.getMinutes();
        for (const sl of sched) {
          if (nowMin >= sl.s && nowMin < sl.e && sl.color !== 'none') { colorKey = sl.color; break; }
        }
      }
      if (colorKey !== lastBgKey) {
        document.body.style.backgroundColor = BG_GRADIENTS[colorKey];
        lastBgKey = colorKey;
      }
    }

    // ── Search ────────────────────────────────────────────────────────
    function highlightMatch(text, query) {
      const idx = text.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escHtml(text);
      return escHtml(text.slice(0, idx)) +
             `<mark>${escHtml(text.slice(idx, idx + query.length))}</mark>` +
             escHtml(text.slice(idx + query.length));
    }

    function doSearch(query) {
      const q   = query.trim();
      const ql  = q.toLowerCase();
      const resultsEl = document.getElementById('search-results');
      if (!q) { resultsEl.innerHTML = ''; return; }

      const today = new Date(); today.setHours(0,0,0,0);
      const results = [];

      for (const [key, menu] of Object.entries(MENU)) {
        const [yr, mo, dy] = key.split('-').map(Number);
        const date     = new Date(yr, mo - 1, dy);
        const dayName  = DAY_NAMES[date.getDay()].toLowerCase();
        const monName  = MON_NAMES[date.getMonth()].toLowerCase();
        const monShort = monName.slice(0, 3);
        const fullStr  = friendlyDate(date).toLowerCase();

        const dateMatch =
          dayName.startsWith(ql) ||
          monName.startsWith(ql) ||
          monShort.startsWith(ql) ||
          String(dy) === ql ||
          fullStr.includes(ql);

        const hits = [];
        [['Main', menu.main], ["Bowl'd", menu.bowl], ['Soup', menu.soup]].forEach(([sec, items]) => {
          items.forEach(item => {
            if (item.toLowerCase().includes(ql)) hits.push({ sec, item });
          });
        });

        if (hits.length || dateMatch) results.push({ date, key, hits, dateMatch: dateMatch && !hits.length });
      }

      results.sort((a, b) => a.date - b.date);

      if (!results.length) {
        resultsEl.innerHTML = `<p class="search-empty">Nothing found for "<strong>${escHtml(q)}</strong>"</p>`;
        return;
      }

      const firstUpcoming = results.find(r => r.date >= today);

      resultsEl.innerHTML = results.map(r => {
        const isPast  = r.date < today;
        const isToday = r.date.toDateString() === today.toDateString();
        const isNext  = !isPast && r === firstUpcoming && !isToday;
        let badge = '';
        if (isToday) badge = '<span class="result-badge">Today</span>';
        else if (isNext) badge = '<span class="result-badge next">Next</span>';

        let matchHtml;
        if (r.dateMatch) {
          const m = MENU[r.key];
          matchHtml = [['Main', m.main], ["Bowl'd", m.bowl], ['Soup', m.soup]].map(([sec, items]) =>
            items.map(item =>
              `<div class="result-match"><span class="result-section-tag">${escHtml(sec)}</span>${escHtml(item)}</div>`
            ).join('')
          ).join('');
        } else {
          matchHtml = r.hits.map(h =>
            `<div class="result-match"><span class="result-section-tag">${escHtml(h.sec)}</span>${highlightMatch(h.item, q)}</div>`
          ).join('');
        }

        return `<div class="result-card${isPast?' is-past':''}${isToday?' is-today':''}"
                     onclick="render(new Date(${r.date.getFullYear()},${r.date.getMonth()},${r.date.getDate()}));
                              document.getElementById('search-input').blur();
                              window.scrollTo({top:0,behavior:'smooth'})">
          <div class="result-date-row">
            <span class="result-date">${friendlyDate(r.date)}</span>${badge}
          </div>
          <div class="result-matches">${matchHtml}</div>
        </div>`;
      }).join('');
    }

    function clearSearch() {
      const inp = document.getElementById('search-input');
      inp.value = '';
      document.getElementById('search-results').innerHTML = '';
      inp.focus();
    }

    loadSettingsUI();
    render(new Date());
    updateBackground();
    setInterval(updateBackground, 10000);
  </script>
</body>
</html>
